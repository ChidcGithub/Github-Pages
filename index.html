<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chidc - GitHub Portfolio</title>
    <meta name="description" content="Chidc's GitHub portfolio — real-time repositories, stats and READMEs." />
    <script>
      try {
        var t = localStorage.getItem("chidc-theme");
        if (t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FEF7FF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141218" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
